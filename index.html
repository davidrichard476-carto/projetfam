<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Familial</title>

    style.css
</head>

<body>

    <div id="background"></div>

    <header>

        <div class="date-section">
            <div id="clock"></div>
            <div id="date"></div>
        </div>

        <div class="weather-top">
            🌤️ Saint-Paul, QC
            <div id="temp">--°C</div>
        </div>

    </header>

    <div class="container">

        <section class="weather-card">

            <h2>MÉTÉO</h2>

            <div id="currentWeather">
                Chargement...
            </div>

            <div id="forecast">
            </div>

        </section>

        <section class="center-card">

            <h1>DASHBOARD FAMILIAL</h1>

            <div class="big-news">
                Actualités principales
            </div>

            <div id="news">
                Chargement des nouvelles...
            </div>

        </section>

        <section class="sports-card">

            <h2>🏒 NHL</h2>

            <div id="nhl">
                Chargement...
            </div>

            <h2 class="spacer">🏈 NFL</h2>

            <div id="nfl">
                Chargement...
            </div>

        </section>

    </div>

    <footer>

        <div id="ticker">
            Chargement...
        </div>

    </footer>

    app.jsscript>

</body>

</html>
