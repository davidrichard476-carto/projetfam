<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Familial</title>

    style.css
</head>

<body>

    <div id="background"></div>

    <header>
        <div>
            <div id="clock"></div>
            <div id="date"></div>
        </div>

        <div id="weather-top">
            <span id="temp">--°C</span>
        </div>
    </header>

    <main>

        <aside class="weather-panel">
            <h2>🌤️ MÉTÉO</h2>

            <div id="weather-desc">Chargement...</div>

            <div id="forecast">
                Prévisions à venir...
            </div>
        </aside>

        <section class="center-panel">
            <div class="family-title">
                Famille Richard
            </div>
        </section>

        <aside class="sports-panel">

            <h2>🏒 NHL</h2>
            <div id="nhl-scores">
                Chargement...
            </div>

            <h2 class="nfl-title">🏈 NFL</h2>
            <div id="nfl-scores-side">
                Chargement...
            </div>

        </aside>

    </main>

    <footer>
        <div id="ticker">
            Chargement des résultats NFL...
        </div>
    </footer>

    app.jsscript>

</body>

</html>
